<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <title>WahlOMatic Logo</title>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;" />
      <stop offset="100%" style="stop-color:#1D4ED8;" />
    </linearGradient>
  </defs>
  <!-- Background shape for standalone icon use -->
  <rect width="100" height="100" rx="18" fill="white"/>

  <!-- Bars representing data/parties -->
  <rect x="20" y="60" width="15" height="20" rx="3" fill="url(#grad1)" opacity="0.6"/>
  <rect x="42.5" y="40" width="15" height="40" rx="3" fill="url(#grad1)" opacity="0.8"/>
  <rect x="65" y="20" width="15" height="60" rx="3" fill="url(#grad1)"/>
  
  <!-- The Checkmark / "Wahl" -->
  <path d="M25 50 L45 70 L85 30" stroke="#10B981" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>